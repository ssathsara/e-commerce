; Application PHP settings (container).
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 64M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Development: pick up code changes from the mounted volume.
opcache.validate_timestamps = 1
