# Single origin for the whole application (http://localhost:8080):
#   /api, /sanctum  -> Laravel (php-fpm)
#   /storage        -> public uploads served directly from Laravel's storage
#   /               -> React (Vite dev server in development)
# Keeping the SPA and API on one origin lets Sanctum's cookie auth and CSRF work
# without cross-site cookies.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/html/public;

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        # Never execute anything from the uploads directory.
        location ~ \.php$ { return 404; }
    }

    location ~ ^/(api|sanctum)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Everything else is the React app (Vite dev server with HMR websocket).
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
